      e.preventDefault();
      const m = document.getElementById("msg"),
        btn = document.querySelector("button");
      btn.disabled = true;
      m.textContent = "Odszyfrowywanie…";
      try {
        const raw = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(document.getElementById("code").value),
          "PBKDF2",
          false,
          ["deriveKey"],
        );
        const key = await crypto.subtle.deriveKey(

          raw,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"],
        );

          { name: "AES-GCM", iv: bytes(data.iv) },
          key,
          bytes(data.enc),
        );
        document.open();
        document.write(new TextDecoder().decode(plain));
        document.close();
      } catch {
        m.textContent = "Nieprawidłowy klucz lub niedostępne szyfrowanie.";
